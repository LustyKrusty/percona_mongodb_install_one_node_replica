---
- name: Create pmm role - pmmRole for MongoDB
  community.mongodb.mongodb_role:
    login_user: "{{ mongodb_admin_user_name }}"
    login_password: "{{ mongodb_admin_password }}"
    name: pmmRole
    roles: []
    database: admin
    privileges:
      - resource:
          db: ""
          collection: ""
        actions:
          - collStats
          - dbHash
          - dbStats
          - find
          - listIndexes
          - listCollections
          - collStats
          - indexStats
      - resource:
          db: ""
          collection: system.profile
        actions:
          - dbStats
          - collStats
          - indexStats
      - resource:
          db: ""
          collection: system.version
        actions:
          - find
    state: present
