---
- name: Init ReplicaSet
  vars:
    nodes: "{{ ansible_play_hosts_all }}"
  community.mongodb.mongodb_replicaset:
    login_database: admin
    replica_set: "{{ mongodb_replica_set_name }}"
    members:
      - host: "{{ hostvars[nodes[0]].ansible_fqdn }}:{{ mongodb_port }}"
        priority: "{{ hostvars[nodes[0]].rs_prio | int }}"
    validate: false

- name: Wait for the replicaset to stabilise
  community.mongodb.mongodb_status:
    replica_set: "{{ mongodb_replica_set_name }}"
    poll: 2
    interval: 30
  ignore_errors: yes