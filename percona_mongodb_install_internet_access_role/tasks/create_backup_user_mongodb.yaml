---
- name: Create buckup user for MongoDB
  mongodb_user:
    login_user: "{{ mongodb_admin_user_name }}"
    login_password: "{{ mongodb_admin_password }}"
    name: "{{ mongodb_backup_user_name }}"
    password: "{{ mongodb_backup_user_password }}"
    roles: 
      - backup
    database: admin
    state: present
