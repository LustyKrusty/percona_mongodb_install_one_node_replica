- name: Install PyMongo 4.8.0 on Ubuntu 24 and higher
  become: true
  pip:
    name: pymongo==4.8.0
    executable: pip3
    extra_args: --break-system-packages
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_version'] is version('24.04', '>=')

- name: Install PyMongo 4.8.0 on Ubuntu 22 and lower
  become: true
  pip:
    name: pymongo==4.8.0
    executable: pip3
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_version'] is version('24.04', '<')