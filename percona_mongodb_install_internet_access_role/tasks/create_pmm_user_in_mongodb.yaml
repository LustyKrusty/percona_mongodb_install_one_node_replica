---
- name: Create pmm user in MongoDB
  mongodb_user:
    login_user: "{{ mongodb_admin_user_name }}"
    login_password: "{{ mongodb_admin_password }}"
    name: "{{ mongodb_pmm_user_in_mongodb_name }}"
    password: "{{ mongodb_pmm_user_in_mongodb_password }}"
    database: admin
    roles:
      - { role: "pmmRole", db: "admin" }
      - { role: "clusterMonitor", db: "admin" }
      - { role: "read", db: "local" }
      - { role: "readWrite", db: "admin", collection: "" }
      - { role: "backup", db: "admin" }
      - { role: "clusterMonitor", db: "admin" }
      - { role: "restore", db: "admin" }
      - { role: "pbmAnyAction", db: "admin" }
    state: present
